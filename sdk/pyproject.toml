# ============================================================
# AgentTrafficCop SDK — packaging config
# ============================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttrafficcop"
version = "0.1.0"
description = "Python SDK for the AgentTrafficCop governance middleware."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "AgentTrafficCop" },
]
keywords = [
    "ai",
    "agents",
    "multi-agent",
    "llm",
    "governance",
    "orchestration",
    "circuit-breaker",
    "langgraph",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.27.0,<0.28.0",
]

[project.optional-dependencies]
langgraph = [
    "langgraph>=1.2.0,<2.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/belalshafeq/Agent_Cop"
Repository = "https://github.com/belalshafeq/Agent_Cop"
Issues = "https://github.com/belalshafeq/Agent_Cop/issues"

[tool.setuptools]
packages = ["agenttrafficcop"]
package-dir = { "" = "." }

[tool.setuptools.package-data]
agenttrafficcop = ["py.typed"]